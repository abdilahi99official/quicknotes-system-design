<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes API Client | Project 2</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>

<body>
    <main class="container">
        <h1>QuickNotes Management</h1>

        <section class="action-section">
            <button id="load-btn" type="button">Load Notes</button>
            <p id="status">Click "Load Notes" to fetch data from server.</p>
        </section>

        <section class="form-section">
            <h2>Create a New Note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="title-input">Title (required, max 100 characters)</label>
                    <input type="text" id="title-input" maxlength="100" placeholder="Note title...">
                </div>
                <div class="form-group">
                    <label for="body-input">Body (optional)</label>
                    <textarea id="body-input" placeholder="Note content..."></textarea>
                </div>
                <button id="submit-btn" type="submit">Create Note</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Notes Catalog</h2>
            <ul id="notes-list"></ul>
        </section>
    </main>
</body>

</html>
